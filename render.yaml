# Full-Stack ELMS Logistics Service. PostgreSQL supplied by Neon.
services:
  - type: web
    name: ims-logistics
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema apps/backend/prisma/schema.prisma && npm run build
    startCommand: node scripts/start-demo.cjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@demo.example
